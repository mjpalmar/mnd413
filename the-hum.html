/* ---------- State ---------- */
let state = { scene: "intro", who: null, stats: null, flags: {}, finished: [], hum: .25, lastDelta: "" };

function clamp(n){ return Math.max(0, Math.min(100, n)); }

/* ---------- Rendering ---------- */
const $story = document.getElementById("story");
const $note = document.getElementById("notebook");
const $gaugeBox = document.getElementById("gaugeBox");
const $gauges = document.getElementById("gauges");
const $delta = document.getElementById("delta");
const $who = document.getElementById("who");
const $hz = document.getElementById("hz");

function srcList(keys){
  if (!keys || !keys.length) return "";
  return '<div class="src">' + keys.map(k => `<a href="${SRC[k][1]}" target="_blank" rel="noopener">${SRC[k][0]}</a>`).join("") + "</div>";
}

function renderGauges(){
  if (!state.stats) { $gaugeBox.hidden = true; return; }
  $gaugeBox.hidden = false;
  const r = RESIDENTS[state.who];
  $who.textContent = r.name + " · " + r.role.split(" · ")[1];
  const rows = [["Sleep","sleep"],["Savings","savings"],["Voice","voice"]];
  $gauges.innerHTML = rows.map(([label,k]) => {
    const v = state.stats[k];
    return `<div class="gauge"><span>${label}</span><div class="bar" role="meter" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}"><i class="${v<30?'low':''}" style="width:${v}%"></i></div><span class="v">${v}</span></div>`;
  }).join("");
  $delta.textContent = state.lastDelta;
}

function renderIntro(){
  setHum(.25);
  $story.innerHTML = `
    <div class="scene">
      <div class="stamp"><span>A news game</span><span>Loudoun County, Virginia</span></div>
      <h1>The Hum</h1>
      <div class="prose">
        <p class="dek">Ashburn sits in the middle of the largest cluster of data centers on Earth. The buildings pay a huge share of the county's bills. They also run all night, right next to people's homes.</p>
        <p>Choose a resident. Each story starts at the public hearing where a data center gets approved, follows the years of construction, and then the years of living next to it. What you do at the hearing comes back later.</p>
        <p>Every choice shifts three things: how well you sleep, how your finances hold up, and how much say you have in what happens next. There's no perfect ending. There wasn't one for the real people either.</p>
      </div>
      <div class="residents">
        ${Object.entries(RESIDENTS).map(([id,r]) => `
          <button class="resident" type="button" data-start="${id}">
            <span class="role">${r.role}</span>
            <span class="name">${r.name}</span>
            <span class="bio">${r.bio}</span>
            ${state.finished.includes(id) ? '<span class="done">✓ Played</span>' : ''}
          </button>`).join("")}
      </div>
      <p class="footnote">The characters and their streets are composites. The policies, numbers, and disputes in the reporter's notebook come from published reporting and county records, linked beside each scene.</p>
    </div>`;
  $note.className = "notebook";
  $note.innerHTML = `<h3>Reporter's notebook</h3>
    <p>In March 2025, Loudoun supervisors voted 7–2 to end by-right data center construction. New projects now face public hearings.</p>
    <p>Data centers produced about $1.2 billion in county tax revenue in fiscal 2026, roughly 39% of the budget.</p>
    ${srcList(["county","story"])}`;
  renderGauges();
}

function renderScene(id){
  const sc = S[id];
  setHum(sc.hum, sc.hz);
  const val = x => typeof x === "function" ? x(state.stats, state.flags) : x;
  const paras = sc.body.map(val).filter(Boolean).map(p => `<p>${p}</p>`).join("");
  const part = sc.end ? "Ending" : (sc.part || "Part 3 · Living with it");
  let tail = "";
  if (sc.end) {
    const st = state.stats;
    if (!state.finished.includes(state.who)) state.finished.push(state.who);
    const others = Object.keys(RESIDENTS).filter(k => !state.finished.includes(k));
    tail = `<div class="ending-card">
      <div class="stamp"><span>Ending</span><span>${RESIDENTS[state.who].name}</span></div>
      <div class="final">
        <div><b>${st.sleep}</b><span>Sleep</span></div>
        <div><b>${st.savings}</b><span>Savings</span></div>
        <div><b>${st.voice}</b><span>Voice</span></div>
      </div>
      <div class="btn-row">
        ${others.length ? `<button class="btn" type="button" data-start="${others[0]}">Play as ${RESIDENTS[others[0]].name.split(" ")[0]}</button>` : ""}
        <button class="btn ghost" type="button" data-start="${state.who}">Replay ${RESIDENTS[state.who].name.split(" ")[0]}</button>
        <button class="btn ghost" type="button" data-home="1">All residents</button>
      </div>
    </div>`;
  } else {
    tail = `<div class="choices">${sc.choices.map((c,i) => `
      <button class="choice" type="button" data-choice="${i}">
        <span class="k">${String.fromCharCode(65+i)}</span>
        <span class="t">${c.t}${c.s ? `<span class="s">${c.s}</span>` : ""}</span>
      </button>`).join("")}</div>`;
  }
  $story.innerHTML = `<div class="scene">
    <div class="part">${part}</div>
    <div class="stamp"><span>${sc.when}</span><span>${sc.where}</span></div>
    <h2>${val(sc.title)}</h2>
    <div class="prose">${paras}</div>
    ${tail}
  </div>`;

  // notebook: endings show a closing note
  if (sc.note) {
    $note.className = "notebook";
    $note.innerHTML = `<h3>Reporter's notebook · ${sc.note.h}</h3>${sc.note.p.map(p=>`<p>${p}</p>`).join("")}${srcList(sc.note.src)}`;
  } else if (sc.end) {
    $note.className = "notebook";
    $note.innerHTML = `<h3>Reporter's notebook · Where things stand</h3>
      <p>Loudoun is still writing new rules for data center noise, including tonal and low-frequency sound. The state is still deciding how much of the cost of new power lines data centers should carry.</p>
      <p>Meanwhile, more buildings are in the pipeline.</p>
      ${srcList(["noise","vb","wjla"])}`;
  }
  renderGauges();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}

function render(){
  if (state.scene === "intro") renderIntro(); else renderScene(state.scene);
}

function start(id){
  const r = RESIDENTS[id];
  state.who = id; state.stats = { ...r.start }; state.flags = {}; state.scene = r.first; state.lastDelta = "";
  render();
}

function choose(i){
  const sc = S[state.scene];
  const c = sc.choices[i];
  const parts = [];
  for (const [k,v] of Object.entries(c.fx || {})) {
    if (!v) continue;
    state.stats[k] = clamp(state.stats[k] + v);
    parts.push(`${k} ${v>0?"+":""}${v}`);
  }
  state.lastDelta = parts.length ? "Last choice: " + parts.join(" · ") : "";
  if (!state.flags) state.flags = {};
  if (c.flag) state.flags[c.flag] = true;
  state.scene = typeof c.go === "function" ? c.go(state.stats, state.flags) : c.go;
  render();
}

$story.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.start) start(b.dataset.start);
  else if (b.dataset.choice) choose(+b.dataset.choice);
  else if (b.dataset.home) { state.scene = "intro"; state.who = null; state.stats = null; render(); }
});

/* ---------- The hum: waveform + optional tone ---------- */
const canvas = document.getElementById("wave");
const ctx = canvas.getContext("2d");
let humTarget = .25, humNow = .25, t0 = performance.now();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function setHum(v, label){
  humTarget = v;
  const dba = Math.round(35 + v * 40);
  $hz.textContent = (label || (v > .9 ? "generator test" : "ambient")) + " " + dba + " dBA";
  if (audio) audio.update();
}

function draw(now){
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w*dpr)) { canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  humNow += (humTarget - humNow) * 0.04;
  const color = getComputedStyle(document.documentElement).getPropertyValue("--wave").trim() || "#a96200";
  const t = reduce ? 0 : (now - t0) / 1000;
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.globalAlpha = .9;
  ctx.beginPath();
  const amp = 2 + humNow * (h/2 - 3);
  for (let x = 0; x <= w; x += 2) {
    const p = x / w;
    const y = h/2
      + Math.sin(p * 38 + t * 6) * amp * .6
      + Math.sin(p * 91 - t * 11) * amp * .25 * humNow
      + (humNow > .9 ? (Math.sin(p*230 + t*40) * amp * .25) : 0);
    x === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.globalAlpha = .25; ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

let audio = null;
const soundBtn = document.getElementById("soundBtn");
soundBtn.addEventListener("click", () => {
  try {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC();
      const master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
      const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600; lp.connect(master);
      const tones = [[120, .6], [240, .25], [360, .1]].map(([f, g]) => {
        const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = f;
        const gn = ac.createGain(); gn.gain.value = g; o.connect(gn); gn.connect(lp); o.start(); return o;
      });
      // brown-ish noise for generator rumble
      const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = buf.getChannelData(0); let last = 0;
      for (let i = 0; i < d.length; i++) { last = (last + 0.02 * (Math.random()*2-1)) / 1.02; d[i] = last * 3.5; }
      const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
      const ng = ac.createGain(); ng.gain.value = 0; noise.connect(ng); ng.connect(master); noise.start();
      audio = { ac, master, ng, on: false, update(){
        const now = ac.currentTime;
        const target = this.on ? 0.02 + humTarget * 0.08 : 0;
        master.gain.setTargetAtTime(target, now, .4);
        ng.gain.setTargetAtTime(humTarget > .9 ? 1.2 : 0.15 * humTarget, now, .4);
      }};
    }
    audio.on = !audio.on;
    if (audio.ac.state === "suspended") audio.ac.resume();
    audio.update();
    soundBtn.setAttribute("aria-pressed", String(audio.on));
    soundBtn.textContent = audio.on ? "Mute" : "Hear it";
  } catch (err) {
    soundBtn.textContent = "Sound unavailable";
    soundBtn.disabled = true;
  }
});

/* ---------- Boot (keeps progress across live updates) ---------- */
function boot(data){
  if (data && data.state) state = data.state;
  if (!state.flags) state.flags = {};
  render();
}
window.claude?.hot?.snapshot?.(() => ({ state }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
